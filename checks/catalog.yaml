# Executable checkers by id. Rules name a checker id, never a path; the
# implementation with this version ships in harness-forge.
checkers:
  - id: selection.match
    version: 1.0.0
    summary: Selection rule; its predicate over confirmed answers implies an outcome or concept.
    params:
      type: object
      properties:
        when: {$ref: "urn:harness-forge:schema:predicate"}
        implies:
          type: object
          properties:
            outcome: {enum: [harness-only, outside-alongside, outside-instead, reuse, nothing-fits]}
            concept: {type: string, pattern: "^[a-z][a-z0-9-]*$"}
          minProperties: 1
          additionalProperties: false
      required: [when, implies]
      additionalProperties: false
